<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription - Diệu Thảo</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c5a059;
            --dark: #121212;
            --border: #e0e0e0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .sub-card {
            background: white;
            padding: 40px;
            width: 500px;
            border-radius: 2px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 28px;
            text-align: center;
            margin-bottom: 30px;
            color: var(--dark);
        }

        /* SỬ DỤNG CSS GRID THEO YÊU CẦU */
        .grid-form {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Chia 2 cột */
            gap: 20px;
        }

        .full-width { grid-column: span 2; } /* Ô trải dài 2 cột */

        .field-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #999;
            margin-bottom: 8px;
            display: block;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 0;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus { outline: none; border-color: var(--gold); }

        /* Style cho Radio & Checkbox */
        .options-group {
            display: flex;
            gap: 15px;
            font-size: 13px;
            margin-top: 5px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .btn-submit {
            grid-column: span 2;
            background: var(--dark);
            color: white;
            border: none;
            padding: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.4s;
        }

        .btn-submit:hover { background: var(--gold); letter-spacing: 4px; }

        #msg {
            grid-column: span 2;
            display: none;
            padding: 15px;
            background: #fdfaf0;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="sub-card">
    <h2>The Newsletter</h2>
    
    <div class="grid-form">
        <div class="full-width">
            <label class="field-label">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your name">
        </div>

        <div class="full-width">
            <label class="field-label">Email Address</label>
            <input type="email" id="email" placeholder="email@domain.com">
        </div>

        <div>
            <label class="field-label">Plan Type</label>
            <div class="options-group">
                <label class="option-item"><input type="radio" name="plan" value="Monthly" checked> Monthly</label>
                <label class="option-item"><input type="radio" name="plan" value="Yearly"> Yearly</label>
            </div>
        </div>

        <div>
            <label class="field-label">Interests</label>
            <div class="options-group">
                <label class="option-item"><input type="checkbox" class="interest" value="Tech"> Tech</label>
                <label class="option-item"><input type="checkbox" class="interest" value="Fintech"> Fintech</label>
                <label class="option-item"><input type="checkbox" class="interest" value="Design"> Design</label>
            </div>
        </div>

        <button class="btn-submit" onclick="validateSubscription()">Subscribe Now</button>

        <div id="msg">Thành công! Cảm ơn bạn đã đăng ký bản tin của chúng tôi.</div>
    </div>
</div>

<script>
    function validateSubscription() {
        const name = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const interests = document.querySelectorAll('.interest:checked');
        const msgBox = document.getElementById('msg');

        // 1. Kiểm tra trống
        if (name === "" || email === "") {
            alert("Vui lòng điền tên và email!");
            return;
        }

        // 2. Kiểm tra Email format (có @ và .)
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
            alert("Email không đúng định dạng (thiếu @ hoặc domain)!");
            return;
        }

        // 3. Kiểm tra ít nhất 1 interest
        if (interests.length === 0) {
            alert("Vui lòng chọn ít nhất một sở thích!");
            return;
        }

        // Nếu vượt qua tất cả
        msgBox.style.display = "block";
        console.log("Form valid! Ready to send.");
    }
</script>

</body>
</html>
