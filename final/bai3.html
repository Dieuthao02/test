<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator - Diệu Thảo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-gold: #c5a059;
            --text-dark: #1a1a1a;
            --row-even: #fdfdfd;
            --row-odd: #f4f4f4; 
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f9f9f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 4px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.08);
            width: 350px;
            border-left: 4px solid var(--accent-gold);
        }

        h2 {
            font-size: 18px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th {
            background-color: var(--text-dark);
            color: white;
            padding: 12px;
            font-size: 12px;
            text-transform: uppercase;
        }

        tbody tr:nth-child(even) { background-color: var(--row-even); }
        tbody tr:nth-child(odd) { background-color: var(--row-odd); }

        td {
            padding: 12px;
            text-align: center;
            font-size: 14px;
            color: #444;
            border-bottom: 1px solid #eee;
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            background: #fafafa;
            border: 1px dashed var(--accent-gold);
            text-align: center;
            font-weight: 600;
            color: var(--text-dark);
        }

        button {
            width: 100%;
            background: var(--text-dark);
            color: white;
            border: none;
            padding: 12px;
            margin-top: 20px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        button:hover {
            background: var(--accent-gold);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Grades §</h2>
    
    <table>
        <thead>
            <tr>
                <th>Subject ®</th>
                <th>Grade (≥ 0)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Fintech System</td>
                <td class="grade">8.5</td>
            </tr>
            <tr>
                <td>Digital Business</td>
                <td class="grade">9.0</td>
            </tr>
            <tr>
                <td>Web Development</td>
                <td class="grade">9.5</td>
            </tr>
            <tr>
                <td>AI Research</td>
                <td class="grade">8.0</td>
            </tr>
        </tbody>
    </table>

    <div class="result-box">
        Average: <span id="avgResult">---</span>
    </div>

    <button onclick="calculateAverage()">Calculate Average</button>
</div>

<script>
    function calculateAverage() {
        const grades = document.querySelectorAll('.grade');
        let total = 0;

        // Duyệt qua các ô điểm để cộng dồn
        grades.forEach(td => {
            total += parseFloat(td.innerText);
        });

        // Tính trung bình
        const average = total / grades.length;

        // Hiển thị kết quả 
        document.getElementById('avgResult').innerText = average.toFixed(2);
    }
</script>

</body>
</html>
