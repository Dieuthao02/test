<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Diệu Thảo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
    :root {
        --bg-color: #f4f4f4;
        --card-bg: #ffffff;
        --accent-gold: #c5a059;
        --text-main: #1a1a1a;
        --input-border: #e0e0e0;
    }

    body {
        background-color: var(--bg-color);
        background-image: radial-gradient(#d1d1d1 0.5px, transparent 0.5px);
        background-size: 20px 20px;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', sans-serif;
    }

    .registration-container {
        background: var(--card-bg);
        padding: 40px 30px;
        border-radius: 4px;
        box-shadow: 0 30px 60px rgba(0,0,0,0.1);
        width: 300px;
        border-top: 5px solid var(--accent-gold);
        animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .form-header { text-align: center; margin-bottom: 30px; }
    .form-header h2 { 
        margin: 0; font-size: 22px; letter-spacing: 3px; color: var(--text-main); 
    }
    .form-header p { font-size: 10px; text-transform: uppercase; color: #999; margin-top: 8px; }

    .form-group { margin-bottom: 20px; position: relative; }

    label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #555; margin-bottom: 5px; display: block; }

    input {
        width: 100%;
        border: none;
        border-bottom: 1px solid var(--input-border);
        background: transparent !important;
        padding: 10px 0;
        font-size: 13px;
        transition: 0.3s;
        box-sizing: border-box;
    }

    input:focus { outline: none; border-bottom-color: var(--accent-gold); }

    .strength-meter { height: 2px; background: #eee; margin-top: 8px; }
    #strengthBar { height: 100%; width: 0%; transition: 0.4s; }
    #strengthText { font-size: 9px; font-weight: 600; margin-top: 5px; display: block; }

    button {
        width: 100%;
        padding: 15px;
        margin-top: 20px;
        background: var(--text-main);
        color: white;
        border: none;
        letter-spacing: 2px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover { background: var(--accent-gold); letter-spacing: 4px; }

    .custom-file-btn {
        border: 1px solid #eee;
        padding: 12px;
        font-size: 11px;
        text-align: center;
        background: #fafafa;
        cursor: pointer;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .match-status { font-size: 9px; position: absolute; right: 0; top: 0; }
</style>
</head>
<body>

<div class="registration-container">
    <form id="registrationForm">
        <div class="form-header">
            <h2>Welcome</h2>
            <p>Diệu Thảo</p>
        </div>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="User..." required>
        </div>

        <div class="form-group">
            <label>Gmail</label>
            <input type="email" id="email" placeholder="mail@gmail.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
            <div class="strength-meter"><div id="strengthBar"></div></div>
            <span id="strengthText">Security: Empty</span>
        </div>

        <div class="form-group">
            <label>Confirm</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" required>
            <span id="matchLabel" class="match-status"></span>
        </div>

        <div class="form-group">
            <label style="cursor: pointer;">
                <div class="custom-file-btn">
                    <span id="fileName">Upload Avatar</span>
                </div>
                <input type="file" id="profilePic" accept="image/*" style="display:none" required>
            </label>
        </div>

        <button type="submit">Sign Up</button>
    </form>
</div>

<script>
    const pass = document.getElementById('password');
    const bar = document.getElementById('strengthBar');
    const text = document.getElementById('strengthText');
    const confirmPass = document.getElementById('confirmPassword');
    const matchLabel = document.getElementById('matchLabel');

    pass.addEventListener('input', () => {
        const v = pass.value;
        let score = 0;

        if (v.length > 0) {
            const hasLetter = /[a-zA-Z]/.test(v);
            const hasNumber = /[0-9]/.test(v);
            const hasSpecial = /[^A-Za-z0-9]/.test(v);

            if (v.length < 6) {
                score = 1; 
            } else {
                if (hasLetter && hasNumber && hasSpecial) score = 3; 
                else if (hasLetter && hasNumber) score = 2; 
                else score = 1; 
            }
        }

        const levels = [
            { w: '0%', c: '#eee', t: 'Security: Empty' },
            { w: '33%', c: '#ff4757', t: 'Security: Weak ❌' },
            { w: '66%', c: '#ffa502', t: 'Security: Medium ⚠️' },
            { w: '100%', c: '#2ed573', t: 'Security: Strong ✨' }
        ];

        const res = levels[score];
        bar.style.width = res.w;
        bar.style.backgroundColor = res.c;
        text.innerText = res.t;
        text.style.color = res.c;
    });

    confirmPass.addEventListener('input', () => {
        if (confirmPass.value === pass.value && pass.value !== "") {
            matchLabel.innerText = "✅ Match";
            matchLabel.style.color = "#2ed573";
        } else {
            matchLabel.innerText = "❌ No match";
            matchLabel.style.color = "#ff4757";
        }
    });

    document.getElementById('profilePic').addEventListener('change', function() {
        if (this.files[0]) document.getElementById('fileName').innerText = "✔️ " + this.files[0].name;
    });
</script>
</body>
</html>
