<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  :root {
    /* Màu sắc của Blog chính */
    --pink-pastel: #FFB7CE;
    --blue-pastel: #A2E1DB;
    --dark-navy: #11141B;
    --card-bg: #1C1F26;
    --text-gray: #B0B3B8;

    /* Thông số của Carousel Xoay */
    --card-width: 200px;
    --card-height: 280px;
    --translateZ-value: 400px; 
}

body {
    margin: 0;
    background-color: var(--dark-navy);
    color: white;
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    overflow-x: hidden; /* Ngăn vỡ khung ngang */
}

/* --- GIỮ NGUYÊN CÁC CSS HEADER, HERO, GRID CỦA BẠN --- */
header { padding: 25px 5%; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
.logo-box { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 30px; font-weight: 800; text-transform: uppercase; }
.blog-brand { font-family: 'Dancing Script', cursive; font-size: 42px; background: linear-gradient(45deg, var(--pink-pastel), var(--blue-pastel)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
nav ul { display: flex; justify-content: center; gap: 35px; list-style: none; margin-top: 20px; padding: 0; }
nav a { text-decoration: none; color: white; font-weight: 600; font-size: 14px; opacity: 0.8; transition: 0.3s; }
.hero { margin: 20px 5%; height: 400px; border-radius: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1459749411177-042180ce6742?w=1200') center/cover; display: flex; align-items: flex-end; padding: 40px; }

/* --- CSS CHO PHẦN XOAY (ĐÃ CHỈNH SỬA ĐỂ GỘP) --- */
.carousel-section {
    width: 100%;
    height: 550px; /* Giới hạn chiều cao khu vực xoay */
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    perspective: 2000px;
    margin-top: 50px;
}

.slider {
    position: absolute;
    width: var(--card-width);
    height: var(--card-height);
    transform-style: preserve-3d;
    transform: rotateX(-10deg);
    transition: transform 0.3s ease-out;
}

.item {
    position: absolute;
    inset: 0;
    transform: rotateY(calc((var(--position) - 1) * (360deg / var(--quantity)))) translateZ(var(--translateZ-value));
}

.item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border: 2px solid rgba(255,255,255,0.1);
    transition: 0.3s;
}

.item img:hover {
    border-color: var(--pink-pastel);
    transform: scale(1.05);
}

/* Các phần Grid khác của bạn */
.container { padding: 40px 5%; }
.section-header { display: flex; align-items: center; font-size: 24px; font-weight: 700; margin-bottom: 25px; gap: 10px; }
.section-header::after { content: ''; flex: 1; height: 2px; background: linear-gradient(to right, var(--blue-pastel), transparent); }

    </style>
</head>
<body>
    <div class="banner">
    <!-- Giữ nguyên --quantity là 10 -->
    <div class="slider" style="--quantity: 10;">
        <div class="item" style="--position: 1;">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500&auto=format" alt="Nature 1">
        </div>
        <div class="item" style="--position: 2;">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500&auto=format" alt="Nature 2">
        </div>
        <div class="item" style="--position: 3;">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500&auto=format" alt="Nature 3">
        </div>
        <div class="item" style="--position: 4;">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=500&auto=format" alt="Nature 4">
        </div>
        <div class="item" style="--position: 5;">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=500&auto=format" alt="Nature 5">
        </div>
        <div class="item" style="--position: 6;">
            <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bdb?w=500&auto=format" alt="Nature 6">
        </div>
        <div class="item" style="--position: 7;">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500&auto=format" alt="Nature 7">
        </div>
        <div class="item" style="--position: 8;">
            <img src="https://images.unsplash.com/photo-1505765050516-f72dcac9c60e?w=500&auto=format" alt="Nature 8">
        </div>
        <div class="item" style="--position: 9;">
            <img src="https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=500&auto=format" alt="Nature 9">
        </div>
        <div class="item" style="--position: 10;">
            <img src="https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=500&auto=format" alt="Nature 10">
        </div>
    </div>
</div>
    <script>
       const slider = document.querySelector('.slider');
// Lấy số lượng card từ HTML
const quantity = parseInt(slider.style.getPropertyValue('--quantity')) || 10; 

// Sự kiện chuột di chuyển
window.addEventListener('mousemove', (e) => {
    // 1. Tính toán vị trí chuột phần trăm (-0.5 đến 0.5)
    let percentage = (e.clientX / window.innerWidth) - 0.5; 
    
    // 2. Tính góc xoay Y. 
    // Chúng ta muốn khi di chuột sát lề, nó xoay khoảng 2-3 card để nhìn thấy rõ sự vòng quay.
    // Góc xoay của 1 card = 360 / quantity.
    // Xoay tối đa = (góc của 1 card) * (số card muốn thấy)
    const cardsToScroll = 3; 
    let angleY = percentage * (360 / quantity) * cardsToScroll; 
    
    // 3. (Tùy chọn) Thêm xoay X để góc nhìn thay đổi theo chiều dọc
    let percentageY = (e.clientY / window.innerHeight) - 0.5;
    let angleX = percentageY * -15; // Xoay nhẹ theo trục X (-7.5 đến 7.5 độ)

    // 4. Áp dụng transform (Nhớ giữ lại rotateX(-5deg) gốc từ CSS)
    slider.style.transform = `rotateX(${-5 + angleX}deg) rotateY(${angleY}deg)`;
});
    </script>
</div>
</body>
</html>
